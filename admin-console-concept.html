<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>// BUREAU NOIR :: DOSSIER CONSOLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050708; --panel:#0b1211f0; --panel-2:#0e1a17; --line:rgba(23,233,160,.18); --line-strong:rgba(23,233,160,.4);
    --emerald:#17e9a0; --pink:#ff4fae; --text:#dfeee9; --text-dim:#7f948d; --text-faint:#4c5b56;
    --warn:#ffb84f; --danger:#ff4f6a;
    --font-display:'Orbitron',sans-serif; --font-body:'Rajdhani',sans-serif; --font-mono:'Share Tech Mono',monospace;
  }
  html[data-theme="light"]{
    --bg:#efe6d2; --panel:#f7f1e2f0; --panel-2:#f0e8d3; --line:rgba(13,122,86,.25); --line-strong:rgba(13,122,86,.55);
    --emerald:#0d8f63; --pink:#c22e83; --text:#231f18; --text-dim:#5c5340; --text-faint:#8c8065;
    --warn:#a5730c; --danger:#c23a4e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; transition:.5s;}
  .app{display:grid; grid-template-columns:220px 1fr; min-height:100vh;}
  @media(max-width:820px){.app{grid-template-columns:1fr;}}

  /* SIDEBAR */
  .side{background:var(--panel-2); border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:18px;}
  .brand{font-family:var(--font-display); font-size:.85rem; letter-spacing:2px; color:var(--emerald); display:flex; align-items:center; gap:8px;}
  .brand .dot{width:8px; height:8px; border-radius:50%; background:var(--pink); box-shadow:0 0 8px var(--pink);}
  .navgroup .label{font-family:var(--font-mono); font-size:9.5px; letter-spacing:2px; color:var(--text-faint); margin:14px 0 8px;}
  .navitem{display:flex; align-items:center; justify-content:space-between; font-family:var(--font-mono); font-size:11px; letter-spacing:1px; padding:9px 10px; color:var(--text-dim); cursor:pointer; border-left:2px solid transparent; transition:.2s;}
  .navitem:hover{color:var(--text); background:var(--panel);}
  .navitem.active{color:var(--emerald); border-left-color:var(--emerald); background:var(--panel);}
  .navitem .n{font-size:9px; color:var(--text-faint); border:1px solid var(--line); padding:1px 6px;}
  #themeToggle{margin-top:auto; font-family:var(--font-mono); font-size:10px; letter-spacing:1px; background:var(--panel); border:1px solid var(--line); color:var(--text-dim); padding:9px; cursor:pointer;}
  #themeToggle:hover{border-color:var(--pink); color:var(--pink);}

  /* MAIN */
  .main{padding:22px 26px 60px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:20px;}
  .topbar h1{font-family:var(--font-display); font-size:1.1rem; letter-spacing:2px; text-transform:uppercase;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; padding:9px 14px; border:1px solid var(--line-strong); background:var(--panel); color:var(--text-dim); cursor:pointer; transition:.2s;}
  .btn:hover{border-color:var(--emerald); color:var(--emerald);}
  .btn.primary{border-color:var(--pink); color:var(--pink);}
  .btn.primary:hover{background:var(--pink); color:var(--bg);}
  input[type=file]{display:none;}

  .status{font-family:var(--font-mono); font-size:10px; color:var(--text-dim); margin-bottom:14px; min-height:16px;}
  .status.ok{color:var(--emerald);}
  .status.err{color:var(--danger);}

  /* BULK GRID */
  table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line);}
  thead th{text-align:left; font-family:var(--font-mono); font-size:9.5px; letter-spacing:1.5px; color:var(--text-faint); padding:10px 12px; border-bottom:1px solid var(--line-strong); background:var(--panel-2); position:sticky; top:0;}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line); font-size:.85rem; color:var(--text);}
  tbody tr:hover{background:var(--panel-2);}
  td[contenteditable="true"]{cursor:text; outline:none;}
  td[contenteditable="true"]:focus{background:rgba(255,79,174,.08); box-shadow:inset 0 0 0 1px var(--pink);}
  .lvltag{font-family:var(--font-mono); font-size:9px; letter-spacing:1px; padding:3px 8px; border:1px solid; display:inline-block;}
  .lvltag.medium{color:var(--warn); border-color:var(--warn);}
  .lvltag.high, .lvltag.veryhigh{color:var(--danger); border-color:var(--danger);}
  .lvltag.low{color:var(--emerald); border-color:var(--emerald);}
  .rowbtn{font-family:var(--font-mono); font-size:9px; color:var(--text-dim); border:1px solid var(--line); background:none; padding:4px 8px; cursor:pointer;}
  .rowbtn:hover{color:var(--emerald); border-color:var(--emerald);}

  /* INLINE EDITOR PANEL */
  .editor{display:none; background:var(--panel); border:1px solid var(--line-strong); margin-top:18px; padding:22px;}
  .editor.open{display:block;}
  .editor h2{font-family:var(--font-display); font-size:1rem; letter-spacing:2px; margin-bottom:16px; color:var(--emerald);}
  .field{margin-bottom:16px;}
  .field label{display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:1.5px; color:var(--text-faint); margin-bottom:6px;}
  .field [contenteditable="true"]{background:var(--panel-2); border:1px solid var(--line); padding:10px 12px; font-size:.92rem; line-height:1.6; outline:none;}
  .field [contenteditable="true"]:focus{border-color:var(--pink); box-shadow:0 0 0 1px var(--pink);}
  .savebar{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .savebar .savedflag{font-family:var(--font-mono); font-size:9.5px; color:var(--emerald); opacity:0; transition:.3s;}
  .savebar .savedflag.show{opacity:1;}

  .imgfield{display:flex; align-items:center; gap:12px;}
  .imgfield .thumb{width:60px; height:60px; background:var(--panel-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.7rem; color:var(--text-faint); flex-shrink:0;}
  .imgfield .sizewarn{font-family:var(--font-mono); font-size:9px; color:var(--danger);}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="dot"></span>DOSSIER CONSOLE</div>
    <div class="navgroup">
      <div class="label">VIEWS</div>
      <div class="navitem active" data-view="bulk">Bulk Editor <span class="n" id="countTag">4</span></div>
      <div class="navitem" data-view="single" id="navSingle" style="display:none;">Editing Dossier</div>
    </div>
    <div class="navgroup">
      <div class="label">SESSION</div>
      <div class="navitem" style="color:var(--text-dim); cursor:default;">GM: M. Sable</div>
      <div class="navitem" style="color:var(--text-dim); cursor:default;">Access: Editor</div>
    </div>
    <button id="themeToggle">TOGGLE THEME</button>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="viewTitle">Bulk Dossier Editor</h1>
      <div class="toolbar">
        <button class="btn" id="exportXml">Export XML</button>
        <button class="btn" id="importXmlBtn">Import XML</button>
        <input type="file" id="importXml" accept=".xml">
        <button class="btn" id="exportCsv">Export Objectives CSV</button>
        <button class="btn" id="importCsvBtn">Import Objectives CSV</button>
        <input type="file" id="importCsv" accept=".csv">
        <button class="btn primary" id="addRow">+ New Dossier</button>
      </div>
    </div>

    <div class="status" id="statusLine">Ready. Editing cells autosaves on blur (simulated — wire to Sanity mutate in production).</div>

    <div id="bulkView">
      <table>
        <thead>
          <tr><th>Code</th><th>Title</th><th>Location</th><th>Threat (Pale)</th><th>Objectives</th><th></th></tr>
        </thead>
        <tbody id="gridBody"></tbody>
      </table>
    </div>

    <div class="editor" id="editorPanel">
      <h2 id="editorTitle">DOSSIER — DETAIL</h2>
      <div class="field">
        <label>Title</label>
        <div contenteditable="true" data-bind="title"></div>
      </div>
      <div class="field">
        <label>Location</label>
        <div contenteditable="true" data-bind="location"></div>
      </div>
      <div class="field">
        <label>Situation Overview</label>
        <div contenteditable="true" data-bind="overview" style="min-height:80px;"></div>
      </div>
      <div class="field">
        <label>Hero Image (Sanity asset — max 500KB, auto-compressed on upload)</label>
        <div class="imgfield">
          <div class="thumb" id="thumbPreview">NONE</div>
          <button class="btn">Upload Image</button>
          <span class="sizewarn" id="sizeWarn"></span>
        </div>
      </div>
      <div class="savebar">
        <button class="btn primary" id="closeEditor">← Back to Grid</button>
        <span class="savedflag" id="savedFlag">✓ Saved to Sanity</span>
      </div>
    </div>
  </main>
</div>

<script>
  // ---------- MOCK DATA (stand-in for Sanity documents) ----------
  let dossiers = [
    {id:'BN-DAWN-119-08', title:'Operation: Dead Thread', location:'Gates of Dawn Caravanserai, DAWN',
     overview:'Following the interception of an ore convoy at Cinder Station, the sample was transferred to Docking Bay 6 for delivery to "Sable."',
     threatPale:'very-high',
     objectives:[
       {priority:'primary', title:'Establish Contact With Sable', status:'open'},
       {priority:'primary', title:'Investigate the Arachne Blind Spot', status:'open'},
       {priority:'secondary', title:'Uncover Project Mirrorglass', status:'done'}
     ]},
    {id:'BN-CIND-119-05', title:'Cinder Station Convoy', location:'Cinder Station, DAWN Belt',
     overview:'Initial interception of the ore convoy carrying the biological sample.',
     threatPale:'medium',
     objectives:[{priority:'primary', title:'Recover Cargo Manifest', status:'done'}]},
    {id:'BN-BARK-118-11', title:'Baraka Deep-7 Incident', location:'Baraka Deep-7 Facility',
     overview:'First indication of external network compromise in Nomad infrastructure.',
     threatPale:'high',
     objectives:[{priority:'primary', title:'Assess Facility Damage', status:'done'},{priority:'secondary', title:'Interview Survivors', status:'open'}]},
    {id:'BN-DAWN-119-09', title:'The Pale Signal', location:'Gates of Dawn, Docking Ring',
     overview:'Follow-up investigation into intercepted Pale Network transmissions.',
     threatPale:'very-high',
     objectives:[{priority:'primary', title:'Triangulate Signal Origin', status:'open'}]}
  ];
  let activeId = null;

  const gridBody = document.getElementById('gridBody');
  const countTag = document.getElementById('countTag');
  const statusLine = document.getElementById('statusLine');

  function levelClass(v){ return v.replace('-',''); }

  function renderGrid(){
    gridBody.innerHTML = '';
    dossiers.forEach(d=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-family:var(--font-mono); font-size:10px; color:var(--text-dim);">${d.id}</td>
        <td contenteditable="true" data-id="${d.id}" data-field="title">${d.title}</td>
        <td contenteditable="true" data-id="${d.id}" data-field="location">${d.location}</td>
        <td><span class="lvltag ${levelClass(d.threatPale)}">${d.threatPale.toUpperCase()}</span></td>
        <td style="font-family:var(--font-mono); font-size:10px; color:var(--text-dim);">${d.objectives.filter(o=>o.status==='done').length} / ${d.objectives.length} done</td>
        <td><button class="rowbtn" data-open="${d.id}">OPEN →</button></td>
      `;
      gridBody.appendChild(tr);
    });
    countTag.textContent = dossiers.length;
    gridBody.querySelectorAll('td[contenteditable]').forEach(td=>{
      td.addEventListener('blur', ()=>{
        const d = dossiers.find(x=>x.id===td.dataset.id);
        d[td.dataset.field] = td.textContent.trim();
        flashStatus(`Saved ${td.dataset.field} → ${d.id} (simulated PATCH to Sanity)`, 'ok');
      });
    });
    gridBody.querySelectorAll('[data-open]').forEach(btn=>{
      btn.addEventListener('click', ()=>openEditor(btn.dataset.open));
    });
  }

  function flashStatus(msg, cls){
    statusLine.textContent = msg;
    statusLine.className = 'status ' + (cls||'');
  }

  // ---------- SINGLE EDITOR ----------
  const editorPanel = document.getElementById('editorPanel');
  const navSingle = document.getElementById('navSingle');
  const viewTitle = document.getElementById('viewTitle');

  function openEditor(id){
    activeId = id;
    const d = dossiers.find(x=>x.id===id);
    document.getElementById('editorTitle').textContent = d.id + ' — DETAIL';
    document.querySelector('[data-bind="title"]').textContent = d.title;
    document.querySelector('[data-bind="location"]').textContent = d.location;
    document.querySelector('[data-bind="overview"]').textContent = d.overview;
    editorPanel.classList.add('open');
    navSingle.style.display = 'flex';
    navSingle.textContent = 'Editing: ' + d.id;
    viewTitle.textContent = 'Dossier Detail';
    document.querySelectorAll('.navitem').forEach(n=>n.classList.remove('active'));
    navSingle.classList.add('active');
  }
  document.getElementById('closeEditor').addEventListener('click', ()=>{
    editorPanel.classList.remove('open');
    navSingle.style.display = 'none';
    viewTitle.textContent = 'Bulk Dossier Editor';
    document.querySelector('[data-view="bulk"]').classList.add('active');
  });
  document.querySelectorAll('.editor [contenteditable]').forEach(el=>{
    el.addEventListener('blur', ()=>{
      if(!activeId) return;
      const d = dossiers.find(x=>x.id===activeId);
      d[el.dataset.bind] = el.textContent.trim();
      const flag = document.getElementById('savedFlag');
      flag.classList.add('show');
      setTimeout(()=>flag.classList.remove('show'), 1600);
      renderGrid();
    });
  });

  // ---------- THEME ----------
  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const html = document.documentElement;
    html.setAttribute('data-theme', html.getAttribute('data-theme')==='light' ? 'dark' : 'light');
  });

  // ---------- XML EXPORT / IMPORT ----------
  function toXml(){
    const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<dossiers>\n';
    dossiers.forEach(d=>{
      xml += `  <dossier id="${d.id}">\n`;
      xml += `    <meta><title>${esc(d.title)}</title><location>${esc(d.location)}</location></meta>\n`;
      xml += `    <overview><![CDATA[${d.overview}]]></overview>\n`;
      xml += `    <threatAssessment><threat label="Pale Network" level="${d.threatPale}"/></threatAssessment>\n`;
      xml += `    <objectives>\n`;
      d.objectives.forEach(o=>{
        xml += `      <objective priority="${o.priority}" status="${o.status}">${esc(o.title)}</objective>\n`;
      });
      xml += `    </objectives>\n  </dossier>\n`;
    });
    xml += '</dossiers>';
    return xml;
  }
  document.getElementById('exportXml').addEventListener('click', ()=>{
    const blob = new Blob([toXml()], {type:'application/xml'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'dossiers-export.xml'; a.click();
    flashStatus('Exported ' + dossiers.length + ' dossiers to XML.', 'ok');
  });

  document.getElementById('importXmlBtn').addEventListener('click', ()=> document.getElementById('importXml').click());
  document.getElementById('importXml').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const doc = new DOMParser().parseFromString(reader.result, 'application/xml');
        if(doc.querySelector('parsererror')) throw new Error('Malformed XML');
        const nodes = [...doc.querySelectorAll('dossier')];
        let imported = 0;
        nodes.forEach(n=>{
          const id = n.getAttribute('id');
          const title = n.querySelector('meta > title')?.textContent || '';
          const location = n.querySelector('meta > location')?.textContent || '';
          const overview = n.querySelector('overview')?.textContent || '';
          const threat = n.querySelector('threatAssessment threat')?.getAttribute('level') || 'medium';
          const objectives = [...n.querySelectorAll('objectives > objective')].map(o=>({
            priority:o.getAttribute('priority'), status:o.getAttribute('status'), title:o.textContent
          }));
          const existing = dossiers.find(d=>d.id===id);
          if(existing){ Object.assign(existing, {title, location, overview, threatPale:threat, objectives}); }
          else{ dossiers.push({id, title, location, overview, threatPale:threat, objectives}); }
          imported++;
        });
        renderGrid();
        flashStatus(`Imported/updated ${imported} dossiers from XML (would run as one Sanity transaction).`, 'ok');
      }catch(err){ flashStatus('XML import failed: ' + err.message, 'err'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  // ---------- CSV EXPORT / IMPORT (flat: objectives across all dossiers) ----------
  function toCsv(){
    const rows = [['dossier_id','priority','status','title']];
    dossiers.forEach(d=> d.objectives.forEach(o=> rows.push([d.id, o.priority, o.status, o.title])));
    return rows.map(r=> r.map(v=> `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  }
  document.getElementById('exportCsv').addEventListener('click', ()=>{
    const blob = new Blob([toCsv()], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'objectives-export.csv'; a.click();
    flashStatus('Exported objectives to CSV for bulk spreadsheet editing.', 'ok');
  });

  document.getElementById('importCsvBtn').addEventListener('click', ()=> document.getElementById('importCsv').click());
  document.getElementById('importCsv').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const lines = reader.result.trim().split('\n').slice(1);
        let updated = 0;
        lines.forEach(line=>{
          const [id, priority, status, title] = line.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g).map(v=>v.replace(/^"|"$/g,'').replace(/""/g,'"'));
          const d = dossiers.find(x=>x.id===id);
          if(!d) return;
          const existingObj = d.objectives.find(o=>o.title===title);
          if(existingObj){ existingObj.priority = priority; existingObj.status = status; }
          else{ d.objectives.push({priority, status, title}); }
          updated++;
        });
        renderGrid();
        flashStatus(`Bulk-updated ${updated} objectives from CSV.`, 'ok');
      }catch(err){ flashStatus('CSV import failed: ' + err.message, 'err'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  document.getElementById('addRow').addEventListener('click', ()=>{
    const n = dossiers.length + 1;
    const id = 'BN-NEW-' + String(100+n);
    dossiers.push({id, title:'Untitled Dossier', location:'TBD', overview:'', threatPale:'medium', objectives:[]});
    renderGrid();
    flashStatus('New dossier scaffolded: ' + id, 'ok');
  });

  renderGrid();
</script>
</body>
</html>
